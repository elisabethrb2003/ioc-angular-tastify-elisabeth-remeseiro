<form #filterForm="ngForm" (ngSubmit)="applyFilters()" class="recipe-filter">

  <div class="filter-field">
    <label for="searchText">Cerca una recepta:</label>

    <input
      type="text"
      id="searchText"
      name="searchText"
      [(ngModel)]="searchText"
      required
      minlength="3"
      #searchInput="ngModel"
      placeholder="Escriu almenys 3 caràcters..."
    />

    @if (searchInput.invalid && (searchInput.dirty || searchInput.touched)) {
      <p class="error-message">
        @if (searchInput.errors?.['required']) {
          El camp de cerca és obligatori.
        } @else if (searchInput.errors?.['minlength']) {
          La cerca ha de tenir almenys 3 caràcters.
        }
      </p>
    }
  </div>

  <div class="filter-field">
    <label for="category">Categoria:</label>

    <select
      id="category"
      name="category"
      [(ngModel)]="selectedCategory"
    >
      <option value="Totes">Totes les categories</option>

      @for (category of categories; track category) {
        <option [value]="category">{{ category }}</option>
      }
    </select>
  </div>

  <div class="filter-buttons">
    <button type="submit" [disabled]="filterForm.invalid">
      Aplicar filtres
    </button>

    <button type="button" (click)="resetFilters()">
      Restablir filtres
    </button>
  </div>

</form>
